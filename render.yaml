# Configuração de deploy no Render (Blueprint).
# Em render.com: New > Blueprint > selecione este repositório.
services:
  - type: web
    name: busca-sus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # O banco fictício é recriado a cada inicialização, assim as datas
    # de sincronização das unidades continuam atuais.
    startCommand: python seed.py && gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SEGURO
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.3
